<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>
        <form class="todo-input">
            <input type="text" placeholder="Add a new task...">
            <button>Ajouter</button>
        </form>
        <ul class="todo-list">
            <li class="todo-item">
                <p class="todo-text"> Promener le chien</p>
                <div class="todo-buttons">
                    <button class="done-button">✔</button>
                    <button class="delete-button" >✖</button>
                </div>
            </li>
            <li class="todo-item">
                <p class="todo-text">Faire le ménage</p>
                <div class="todo-buttons">
                    <button class="done-button">✔</button>
                    <button class="delete-button">✖</button>
                </div>
            </li>
            <li class="todo-item">
                <p class="todo-text">Faire le TP2</p>
                <div class="todo-buttons">
                    <button class="done-button">✔</button>
                    <button class="delete-button">✖</button>
                </div>
            </li>
            <li class="todo-item">
                <p class="todo-text done">Maitriser styles dynamiques</p>
                <div class="todo-buttons">
                    <button class="done-button undone">↩</button>
                    <button class="delete-button">✖</button>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
